# Replace these executable paths with your own trusted renderers.
# Each renderer's successful nonempty stdout becomes the exact email body.
version = 1

[productions.daily-report]
render = ["/absolute/path/render-report", "--daily"]
subject = "Daily report"

[productions.daily-report.schedule]
kind = "local-calendar"
hour = 9
minute = 0

[productions.hourly-report]
render = ["/absolute/path/render-hourly"]
# Omitted subject defaults to hourly-report.

[productions.hourly-report.schedule]
kind = "interval"
seconds = 3600
