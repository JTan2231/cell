[package]
name = "annals-usage"
version = "0.2.1"
edition.workspace = true

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
nucleus-client = { git = "https://github.com/JTan2231/nucleus-rs.git", tag = "v0.2.0" }
nucleus-core = { git = "https://github.com/JTan2231/nucleus-rs.git", tag = "v0.2.0" }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["raw_value"] }
thiserror = "2.0.16"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.53", features = ["rt", "time"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.21.0"
