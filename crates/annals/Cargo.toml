[package]
name = "annals"
version = "0.8.0"
edition.workspace = true

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.46", features = ["derive"] }
fs2 = "0.4.3"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
toml = "1.1.4"
unicode-normalization = "0.1.24"

[dev-dependencies]
tempfile = "3.21.0"
