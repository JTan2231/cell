[workspace]
members = [
    "prompting",
    "deployment/crates/cell-install",
    "deployment/crates/cell-maintenance",
    "infrastructure/nucleus/crates/nucleus-cli",
    "infrastructure/nucleus/crates/nucleus-client",
    "infrastructure/nucleus/crates/nucleus-core",
    "infrastructure/nucleus/crates/nucleus-codex",
    "infrastructure/nucleus/crates/nucleus-daemon",
    "infrastructure/nucleus/crates/nucleus-store",
    "products/annals/crates/annals",
    "products/annals/crates/annals-api",
    "products/annals/crates/annals-usage",
    "infrastructure/chancery/crates/chancery",
    "infrastructure/chancery/crates/chancery-usage",
    "infrastructure/email/crates/email",
    "products/conversations/crates/conversations",
    "products/decisions/crates/decisions",
    "products/decisions/crates/krisis-api",
    "infrastructure/semantics",
    "infrastructure/clockwork/crates/clockwork",
    "infrastructure/usher/crates/usher",
    "infrastructure/iatreion/crates/iatreion-api",
    "infrastructure/iatreion/crates/iatreion",
    "products/cast",
    "products/platter",
    "products/clew",
    "infrastructure/bazaar",
    "products/paperboy",
    "products/conatus",
    "infrastructure/emt",
    "products/weaver-narrative",
]
resolver = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
# The six Nucleus crates share this release version. Annals, Annals Usage,
# Chancery, Email, Conversations, Krisis, Semantics,
# Clockwork and Usher declare independent product versions in their
# manifests.
version = "0.5.8"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
cell-prompts = { path = "prompting" }
chancery-usage = { path = "infrastructure/chancery/crates/chancery-usage" }
cell-install = { path = "deployment/crates/cell-install" }
cell-maintenance = { path = "deployment/crates/cell-maintenance" }
iatreion-api = { path = "infrastructure/iatreion/crates/iatreion-api" }
annals-api = { path = "products/annals/crates/annals-api" }
krisis-api = { path = "products/decisions/crates/krisis-api" }
axum = { version = "0.8.9", features = ["json", "tokio"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
libc = "0.2"
nucleus-client = { path = "infrastructure/nucleus/crates/nucleus-client" }
nucleus-core = { path = "infrastructure/nucleus/crates/nucleus-core" }
nucleus-daemon = { path = "infrastructure/nucleus/crates/nucleus-daemon" }
# Select one HTTPS backend for every workspace consumer.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
regex = "1.11"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-human-readable"] }
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1.4"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.24"
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
