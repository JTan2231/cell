[workspace]
members = [
    "crates/nucleus-cli",
    "crates/nucleus-client",
    "crates/nucleus-core",
    "crates/nucleus-codex",
    "crates/nucleus-daemon",
    "crates/nucleus-store",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["json", "tokio"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
http = "1.3"
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-human-readable"] }
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
