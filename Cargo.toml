[workspace]
members = [
    "nucleus/crates/nucleus-cli",
    "nucleus/crates/nucleus-client",
    "nucleus/crates/nucleus-core",
    "nucleus/crates/nucleus-codex",
    "nucleus/crates/nucleus-daemon",
    "nucleus/crates/nucleus-store",
    "annals/crates/annals",
    "annals/crates/annals-usage",
    "todo/crates/todo",
    "chancery/crates/chancery",
    "weaver/crates/weaver",
    "email/crates/email",
    "conversations/crates/conversations",
    "decisions/crates/decisions",
    "semantics",
    "geste/crates/geste",
    "pratica/crates/pratica",
    "clockwork/crates/clockwork",
    "crm/crates/crm",
]
resolver = "3"

[workspace.package]
# The six Nucleus crates share this release version. Annals, Annals Usage,
# Todo, Chancery, Weaver, Email, Conversations, Krisis, Semantics, Geste,
# Pratica, Clockwork, and CRM declare independent product versions in their
# manifests.
version = "0.3.5"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["json", "tokio"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
libc = "0.2"
nucleus-client = { path = "nucleus/crates/nucleus-client" }
nucleus-core = { path = "nucleus/crates/nucleus-core" }
nucleus-daemon = { path = "nucleus/crates/nucleus-daemon" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
regex = "1.11"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-human-readable"] }
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1.4"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.24"
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
