[package]
name = "semantics"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
conversations = { path = "../conversations/crates/conversations" }
fs2 = "0.4"
nucleus-client = { path = "../nucleus/crates/nucleus-client" }
nucleus-core = { path = "../nucleus/crates/nucleus-core" }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53", features = ["full"] }
uuid = { version = "1.18", features = ["v7"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
